<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 1 回帰テスト</title><link rel="stylesheet" href="../styles.css"><main><h1>Phase 1 回帰テスト</h1><p>架空データとメモリ内ストレージのみを使用します。実際の教材は変更しません。</p><pre id="results">実行中…</pre></main><script type="module">import {runTests} from './tests.js';import {runPhase1} from './phase1-tests.js';try{const files=await Promise.all(['sample.deck.json','sample.additional.deck.json','tests/catalog.fixture.json','sample.backup.json'].map(async p=>{const r=await fetch('../'+p);if(!r.ok)throw new Error(p);return r.text();}));document.getElementById('results').textContent=[...runTests(files[0]),...runPhase1(...files.map(s=>JSON.parse(s)))].join('\n');}catch(e){document.getElementById('results').textContent='FAIL '+e.message;}</script></html>
